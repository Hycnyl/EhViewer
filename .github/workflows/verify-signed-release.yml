name: Verify and publish locally signed release
on:
  push:
    branches: [main]
    paths: ['.github/release-candidate.json']
permissions:
  contents: read
concurrency:
  group: signed-release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sourceCommit: ${{ steps.delivery.outputs.sourceCommit }}
      buildRunId: ${{ steps.delivery.outputs.buildRunId }}
      versionName: ${{ steps.delivery.outputs.versionName }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
      - name: Receive and verify signed APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/security/candidate_release.py receive
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Verify Android 13 upgrade and rejection of the compromised signer
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: default
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 tools/security/verify_upgrade.py --default-report candidate/default-report.json --marshmallow-report candidate/marshmallow-report.json --probes candidate/probes --output candidate/upgrade-result.json
      - name: Prepare verified delivery
        id: delivery
        run: python3 tools/security/candidate_release.py finalize
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release
          path: verified-delivery/*
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signing-upgrade-results
          path: candidate/upgrade-result.json
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: verified-release
          path: delivery
      - name: Check delivery hashes
        working-directory: delivery
        run: sha256sum -c SHA256SUMS.txt
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.verify.outputs.versionName }}
          RELEASE_SOURCE: ${{ needs.verify.outputs.sourceCommit }}
        run: |
          gh release create "v$RELEASE_VERSION" delivery/* --target "$RELEASE_SOURCE" --latest \
            --title "EhViewer $RELEASE_VERSION" --notes-file "docs/DELIVERY-$RELEASE_VERSION.md"
      - name: Remove unsigned handoff draft
        env:
          GH_TOKEN: ${{ github.token }}
          UNSIGNED_RUN_ID: ${{ needs.verify.outputs.buildRunId }}
        run: gh release delete "ci-unsigned-$UNSIGNED_RUN_ID" --yes --cleanup-tag
