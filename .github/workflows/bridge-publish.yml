name: Publish verified Android 9 signature bridge
on:
  push:
    branches: [release/1.17.10-bridge]
    paths: ['.github/bridge-candidate.json']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Publish the exact source/candidate that passed the migration check.
          ref: 8e6a8430552385ed1a044c84018b3c5b960f8698
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0
      - name: Receive signed APKs and verify the signing chains
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/security/signature_bridge.py receive
      - name: Reuse the successful Android 9 migration result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          def api(path):
              return subprocess.check_output(['gh', 'api', 'repos/Hycnyl/EhViewer/' + path], text=True)
          job = json.loads(api('actions/jobs/130320171428'))
          run = json.loads(api('actions/runs/42958803820'))
          assert job['run_id'] == 42958803820 and job['status'] == 'completed'
          assert run['head_sha'] == '5c00f4b38607b89dd416e3b42a0e91bf22677cf3'
          step = next(s for s in job['steps'] if s['name'] == 'Verify old app to bridge to Revived on Android 9')
          assert step['conclusion'] == 'success'
          reports = []
          for line in api('actions/jobs/130320171428/logs').splitlines():
              start = line.find('{"api": 28, "fromVersion":')
              if start >= 0:
                  reports.append(json.loads(line[start:]))
          assert len(reports) == 1
          result = reports[0]
          assert (result['api'], result['fromVersion'], result['bridgeVersion'], result['toVersion']) == (28, '1.17.8', '1.17.10', '1.17.17')
          assert [(s['step'], s['versionCode']) for s in result['steps']] == [('bridge', 180085), ('revived', 180092)]
          assert all(s['uidRetained'] is True and s['dataRetained'] is True for s in result['steps'])
          Path('bridge-delivery/bridge-migration.json').write_text(json.dumps(result, indent=2) + '\n')
          print('Reused the successful API 28 two-step migration; no emulator rerun needed')
          PY
      - name: Publish the bridge release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.17.10 bridge-delivery/*
          gh release edit v1.17.10 --draft=false --latest
          BUILD_RUN=$(python3 -c 'import json; print(json.load(open(".github/bridge-candidate.json"))["buildRunId"])')
          gh release delete "ci-bridge-$BUILD_RUN" --yes
