name: Cache rescue APKs
on:
  push:
    branches: [main]
    paths: ['app/**', 'core/**', 'gradle/**', 'build-logic/**', 'rust-toolchain.toml', '*.gradle.kts', '.github/workflows/cache-rescue.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cache-rescue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src/main/rust
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run focused JVM tests
        run: ./gradlew :app:testDefaultReleaseUnitTest :app:assembleDefaultRelease --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - name: Prepare delivery files
        run: |
          mkdir -p delivery
          for abi in universal arm64-v8a armeabi-v7a x86_64 x86; do
            cp "app/build/outputs/apk/default/release/app-default-$abi-release.apk" "delivery/EhViewer-1.15.0-$abi.apk"
          done
          cd delivery
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: EhViewer-1.15.0-apks
          path: delivery/*
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: |
            app/build/test-results/testDefaultReleaseUnitTest/
            app/build/reports/tests/testDefaultReleaseUnitTest/
            app/build/outputs/mapping/defaultRelease/mapping.txt
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.15.0-pre.${{ github.run_number }}" delivery/* \
            --target "$GITHUB_SHA" --prerelease \
            --title "EhViewer 1.15.0 cache rescue (pre.${{ github.run_number }})" \
            --notes-file docs/CACHE_RESCUE.md
