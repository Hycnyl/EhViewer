name: Cache rescue APKs
on:
  push:
    branches: [main]
    paths: ['app/**', 'core/**', 'gradle/**', 'build-logic/**', 'tools/security/**', 'rust-toolchain.toml', '*.gradle.kts', '.github/workflows/cache-rescue.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cache-rescue-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Require completed history cleanup
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          if json.loads(Path('app/signing/release.json').read_text()).get('historySanitized') is not True:
              raise SystemExit('SEC-01: history cleanup must finish before building the release handoff')
          PY
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src/main/rust
      - uses: gradle/actions/setup-gradle@v4
      - name: Build unsigned release APKs
        run: |
          python3 -m unittest discover -s tools/security -p 'test_*.py' -v
          ./gradlew :app:testDefaultDebugUnitTest :app:assembleDefaultUnsignedRelease :app:assembleMarshmallowUnsignedRelease \
            --no-configuration-cache --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process --stacktrace
      - name: Verify debug builds without release credentials
        run: |
          ./gradlew :app:assembleDefaultDebug :app:assembleMarshmallowDebug \
            --no-configuration-cache --max-workers=1 -Pkotlin.compiler.execution.strategy=in-process
          python3 tools/security/verify_debug.py
      - name: Package unsigned build handoff
        run: python3 tools/security/package_unsigned.py --source-commit "$GITHUB_SHA"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-apks
          path: handoff/*
          retention-days: 7
      - name: Create private build handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ci-unsigned-$GITHUB_RUN_ID" handoff/* \
            --draft --target "$GITHUB_SHA" \
            --title "Unsigned build $GITHUB_RUN_ID" \
            --notes "SEC-01 unsigned APK handoff for local signing."
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-results
          path: |
            app/build/test-results/testDefaultDebugUnitTest/
            app/build/reports/tests/testDefaultDebugUnitTest/
            app/build/outputs/mapping/defaultUnsignedRelease/mapping.txt
